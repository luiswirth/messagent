[package]
name = "messagent"
version = "0.2.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time", "sync", "fs", "signal"] }
# Vibe Together's client library, the only way to call its API, pinned to a commit of its main.
vibetogether-client = { git = "https://github.com/PotentialHedge/vibetogether", rev = "15a52fefb9c50f09a94f396fc851bb13daed3189" }

[dev-dependencies]
axum = "0.8"
# A backend on loopback for the tests, the same commit as the client.
vibetogether-backend = { git = "https://github.com/PotentialHedge/vibetogether", rev = "15a52fefb9c50f09a94f396fc851bb13daed3189" }
tokio = { version = "1.54", features = ["full"] }
