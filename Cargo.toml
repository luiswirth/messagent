[workspace]
members = ["core", "claude"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
songbird = { version = "0.6.1", default-features = false, features = ["driver", "gateway", "twilight", "receive", "rustls", "tws"] }
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
toml = "1"
twilight-gateway = { version = "0.17", default-features = false, features = ["rustls-webpki-roots"] }
twilight-model = "0.17"
ureq = { version = "3", features = ["json"] }
