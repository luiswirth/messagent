[workspace]
members = ["core", "claude"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
agentwire = { git = "https://github.com/luiswirth/agentwire", rev = "af5f960dfd65ff849bae9c189dd5f471ee8dc768" }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
toml = "1"
ureq = { version = "3", features = ["json"] }
