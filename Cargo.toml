[package]
name = "messagent"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
jiff = "0.2"
notify = "8"
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls"] }
mindio = { git = "https://github.com/luiswirth/mindio", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time", "sync", "fs", "signal"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1.54", features = ["full"] }
